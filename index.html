<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="오행" />
<title>오행 — 사주 오행 분석</title>
<meta name="description" content="이름·생년월일·시간만 넣으면 만세력으로 사주 원국을 자동 계산하고 오행·영성 지표로 풀이해 드립니다." />
<meta property="og:title" content="오행 — 사주 오행 분석" />
<meta property="og:description" content="이름·생년월일·시간만 넣으면 사주 원국을 자동 계산해 오행·영성으로 풀이합니다." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23191F28'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='800' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E4%BA%94%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="./styles/app.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">五</span>
        <span class="brand-name">오행</span>
        <span class="brand-sub">사주 오행 분석</span>
      </div>
      <button class="icon-btn" id="btn-restart" title="처음으로" aria-label="처음으로" hidden>↻</button>
    </div>
  </header>

  <main class="main">

    <!-- ============ 입력 화면 ============ -->
    <section class="view" id="view-input">
      <div class="hero">
        <h1 class="hero-title">당신의 사주,<br/>오행으로 읽어드려요</h1>
        <p class="hero-desc">이름과 생년월일, 태어난 시간만 적으면<br/>만세력으로 사주 원국을 자동 계산해 풀이합니다.</p>
      </div>

      <form class="card form" id="saju-form" autocomplete="off">

        <label class="field">
          <span class="field-label">이름 <span class="opt">선택</span></span>
          <input class="input" type="text" id="in-name" placeholder="홍길동" maxlength="20" />
        </label>

        <div class="field">
          <span class="field-label" id="lbl-gender">성별</span>
          <div class="segmented" id="seg-gender" role="group" aria-labelledby="lbl-gender">
            <button type="button" class="seg active" data-val="남" aria-pressed="true">남성</button>
            <button type="button" class="seg" data-val="여" aria-pressed="false">여성</button>
          </div>
        </div>

        <div class="field">
          <span class="field-label" id="lbl-calendar">달력</span>
          <div class="segmented" id="seg-calendar" role="group" aria-labelledby="lbl-calendar">
            <button type="button" class="seg active" data-val="solar" aria-pressed="true">양력</button>
            <button type="button" class="seg" data-val="lunar" aria-pressed="false">음력</button>
          </div>
          <label class="check" id="leap-wrap" hidden>
            <input type="checkbox" id="in-leap" /> <span>윤달 <em id="leap-hint"></em></span>
          </label>
        </div>

        <div class="field">
          <span class="field-label" id="lbl-birth">생년월일</span>
          <div class="row3">
            <select class="input select" id="in-year" aria-label="출생 연도"></select>
            <select class="input select" id="in-month" aria-label="출생 월"></select>
            <select class="input select" id="in-day" aria-label="출생 일"></select>
          </div>
        </div>

        <div class="field">
          <span class="field-label" id="lbl-time">태어난 시간</span>
          <div class="row3">
            <select class="input select" id="in-hour" aria-label="출생 시"></select>
            <select class="input select" id="in-min" aria-label="출생 분"></select>
            <span></span>
          </div>
          <label class="check">
            <input type="checkbox" id="in-notime" /> <span>태어난 시간을 몰라요 (시주 제외)</span>
          </label>
        </div>

        <details class="advanced">
          <summary>고급 설정 <span class="adv-hint">진태양시·자시 경계</span></summary>
          <div class="adv-body">
            <label class="switch-row">
              <span><b>진태양시 보정</b><small>출생지 경도로 실제 태양시 보정 (서울 약 −32분)</small></span>
              <input type="checkbox" id="in-tst" checked class="switch" />
            </label>
            <label class="field inline">
              <span class="field-label sm">출생지</span>
              <select class="input select" id="in-region" aria-label="출생지"></select>
            </label>
            <div class="field">
              <span class="field-label sm" id="lbl-boundary">일주(日柱) 경계 학설</span>
              <div class="segmented small" id="seg-boundary" role="group" aria-labelledby="lbl-boundary">
                <button type="button" class="seg active" data-val="자시" aria-pressed="true">자시(23시) · 다수설</button>
                <button type="button" class="seg" data-val="자정" aria-pressed="false">자정(00시)</button>
              </div>
            </div>
          </div>
        </details>

        <button type="submit" class="cta" id="btn-submit">사주 풀이 보기</button>
        <p class="disclaimer">사주는 정답이 아니라 방향을 보는 지도입니다. 재미와 자기성찰의 참고로 봐 주세요.</p>
      </form>
    </section>

    <!-- ============ 결과 화면 ============ -->
    <section class="view hidden" id="view-result">
      <div id="result-root"></div>
    </section>

  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 맨 위로 -->
<button class="to-top" id="to-top" aria-label="맨 위로" hidden>↑</button>

<!-- 용어 설명 팝오버 -->
<div class="term-pop" id="term-pop" hidden>
  <div class="tp-card" role="dialog" aria-label="용어 설명">
    <div class="tp-title"></div>
    <div class="tp-def"></div>
  </div>
</div>

<!-- 공유 바텀시트 -->
<div class="sheet-backdrop" id="share-sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="공유하기">
    <div class="sheet-grab"></div>
    <h3 class="sheet-title">공유하기</h3>
    <div class="share-grid">
      <button class="share-opt" data-share="kakao"><span class="si" style="background:#FEE500;color:#191600">K</span>카카오톡</button>
      <button class="share-opt" data-share="telegram"><span class="si" style="background:#229ED9;color:#fff">T</span>텔레그램</button>
      <button class="share-opt" data-share="x"><span class="si" style="background:#000;color:#fff">𝕏</span>X</button>
      <button class="share-opt" data-share="link"><span class="si" style="background:#EEF1F4;color:#333D4B">🔗</span>링크 복사</button>
      <button class="share-opt" data-share="image"><span class="si" style="background:#E8F3FF;color:#1B64DA">🖼️</span>이미지 저장</button>
      <button class="share-opt" data-share="more" id="share-native" hidden><span class="si" style="background:#EEF1F4;color:#333D4B">↗</span>더보기</button>
    </div>
    <button class="sheet-close" id="share-close">닫기</button>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
